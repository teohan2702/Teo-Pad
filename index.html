<!DOCTYPE html>
<html lang="tr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="TeoPad — mobil uyumlu, hafif kod ve metin editörü. Dosya aç, düzenle, kaydet. Çevrimdışı çalışır.">
<title>TeoPad — Hafif Kod Editörü</title>


<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'sha256-GclKzOTcYhNEVVMOC+QiTBCrABF7uX6keTzc/EnyTeg=' 'sha256-tip0Ixiz6M6Jd4MUSFnWHafsZyk7WMFxaOx5EywX4vs=';
  style-src 'self' 'unsafe-inline';
  img-src 'self' data:;
  connect-src 'self';
  worker-src 'self' blob:;
  manifest-src 'self';
  base-uri 'none';
  form-action 'none'">


<link rel="manifest" href="manifest.json">
<link rel="icon" href="./icons/favicon.ico" sizes="16x16 32x32 48x48" type="image/x-icon">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="./icons/favicon-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" sizes="180x180">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TeoPad">





<meta name="theme-color" id="themeColor" content="#f8f9fa">

<script>

(function () {
  try {
    var s = localStorage.getItem('teopad:theme') || localStorage.getItem('theme');
    var dark = s ? s === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var m = document.getElementById('themeColor');
    if (m) m.setAttribute('content', dark ? '#252526' : '#f8f9fa');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>

<style>
    :root {
        --bg: #ffffff;
        --text: #2c3e50;
        --bar-bg: #f8f9fa;
        --border: #e9ecef;
        --accent: #007bff;          
        --accent-hover: #0056b3;    
        --num-bg: #f8f9fa;
        --muted: #697077;           
        --selection: #cce5ff;
        --icon-color: #495057;
        --toast-bg: #333333;
        --toast-text: #ffffff;
        --hover-bg: rgba(0,0,0,.05);      
        --active-bg: rgba(0,0,0,.10);
        --scroll-thumb: #c4c8cc;
        --scroll-thumb-hover: #a9aeb3;
        --danger: #b3261e;
        --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        --font-code: ui-monospace, "SF Mono", "Menlo", "Consolas", "Roboto Mono", "Ubuntu Mono", "Noto Mono", monospace;
        --fs-ui: 16px;              
    }

    [data-theme="dark"] {
        --bg: #1e1e1e;
        --text: #d4d4d4;
        --bar-bg: #252526;
        --border: #333333;
        --accent: #3794ff;          
        --accent-hover: #79c0ff;    
        --num-bg: #1e1e1e;
        --muted: #8b949e;           
        --selection: #264f78;
        --icon-color: #cccccc;
        --toast-bg: #e6e6e6;
        --toast-text: #111111;
        --hover-bg: rgba(255,255,255,.10);
        --active-bg: rgba(255,255,255,.15);
        --scroll-thumb: #4a4a4a;
        --scroll-thumb-hover: #5c5c5c;
        --danger: #f28b82;
    }

    
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
    }
    @supports not selector(:focus-visible) {
        :focus { outline: 2px solid var(--accent); outline-offset: 2px; }
    }

    [hidden] { display: none !important; }

    html, body { height: 100%; }

    body {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-ui);
        font-size: var(--fs-ui);
        overflow: hidden;
        padding-bottom: env(safe-area-inset-bottom);
    }

    
    .toolbar {
        flex: 0 0 auto;                 
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        padding: 6px 10px;
        gap: 8px;
        min-height: 50px;
        background: var(--bar-bg);
        border-bottom: 1px solid var(--border);
        transition: background .3s;
    }

    .group { display: flex; align-items: center; gap: 4px; min-width: 0; }
    .grow  { flex: 1 1 240px; }

    button {
        background: transparent;
        border: none;
        color: var(--icon-color);
        min-width: 40px;                
        height: 40px;
        border-radius: 6px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        font: inherit;
        font-size: 14px;
        flex: 0 0 auto;
        transition: background .2s ease, color .2s ease, transform .1s ease;
    }
    button:hover  { background: var(--hover-bg); color: var(--accent-hover); }
    button:active { transform: scale(.95); }

    button[aria-pressed="true"] { background: var(--active-bg); color: var(--accent); }
    button svg { width: 20px; height: 20px; fill: currentColor; flex: 0 0 auto; }
    button.accent { color: var(--accent); }

    input[type="text"] {
        background: transparent;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px;
        font-size: var(--fs-ui);        
        font-family: var(--font-ui);
        transition: border-color .2s;
        min-width: 0;
        flex: 1 1 auto;
        height: 40px;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); opacity: 1; }

    select {
        background: var(--bar-bg);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 8px;
        font-size: var(--fs-ui);        
        font-family: var(--font-ui);
        cursor: pointer;
        height: 40px;
        flex: 0 0 auto;
        transition: border-color .2s;
    }
    select:hover { border-color: var(--accent); }

    
    #searchPanel {
        flex: 0 0 auto;
        background: var(--bar-bg);
        border-bottom: 1px solid var(--border);
        padding: 8px 10px;
        display: flex;
        flex-wrap: wrap;                
        gap: 8px;
        align-items: center;
        animation: slideDown .2s ease-out;
    }
    @keyframes slideDown { from { transform: translateY(-8px); opacity: 0 } to { transform: none; opacity: 1 } }

    .find-row, .rep-row { display: flex; align-items: center; gap: 6px; flex: 1 1 320px; min-width: 0; }

    #findCount {
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        flex: 0 0 auto;
        min-width: 44px;
        text-align: center;
    }

    .checkbox-label {
        font-size: 13px; font-weight: 600; color: var(--icon-color);
        display: inline-flex; align-items: center; justify-content: center;
        cursor: pointer; user-select: none;
        min-width: 40px; height: 40px; padding: 0 10px;
        border-radius: 4px; border: 1px solid var(--border);
        flex: 0 0 auto;
        transition: background .2s, color .2s, border-color .2s;
    }
    .checkbox-label:hover { border-color: var(--accent); }
    .checkbox-label:has(input:checked) { background: var(--active-bg); color: var(--accent); border-color: var(--accent); }
    
    .checkbox-label input[type="checkbox"] {
        position: absolute; width: 1px; height: 1px;
        opacity: 0; margin: 0; pointer-events: none;
    }
    .checkbox-label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }

    
    .editor-wrapper { flex: 1 1 auto; display: flex; position: relative; overflow: hidden; }

    .line-numbers {
        width: 48px;
        flex: 0 0 auto;
        background: var(--num-bg);
        color: var(--muted);
        text-align: right;
        padding: 12px 8px 12px 6px;
        font-family: var(--font-code);
        font-size: var(--fs-ui);
        line-height: 1.6;
        border-right: 1px solid var(--border);
        user-select: none;
        white-space: pre;
        overflow: hidden;
        font-variant-numeric: tabular-nums;
    }
    
    body.wrap .line-numbers { display: none; }

    textarea {
        flex: 1 1 auto;
        border: none;
        padding: 12px;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-code);
        font-size: var(--fs-ui);        
        line-height: 1.6;
        resize: none;
        white-space: pre;
        overflow: auto;
        tab-size: 2;
    }
    textarea:focus-visible { outline: none; }   
    textarea.wrap { white-space: pre-wrap; overflow-wrap: anywhere; }
    ::selection { background: var(--selection); }

    
    .statusbar {
        flex: 0 0 auto;
        display: flex; align-items: center; gap: 10px;
        padding: 4px 10px;
        min-height: 28px;
        background: var(--bar-bg);
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow-x: auto;
        scrollbar-width: none;
    }
    .statusbar::-webkit-scrollbar { display: none; }
    .statusbar .sep { opacity: .45; }
    #dirtyDot { color: var(--danger); font-weight: 700; }
    #storageWarn { color: var(--danger); font-weight: 600; }

    
    #toast {
        position: fixed;
        bottom: calc(20px + env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%) translateY(120px);
        display: flex; align-items: center; gap: 12px;
        max-width: min(92vw, 460px);
        background: var(--toast-bg);
        color: var(--toast-text);
        padding: 10px 16px;
        border-radius: 8px;
        font-size: 14px;
        box-shadow: 0 4px 16px rgba(0,0,0,.25);
        opacity: 0;
        transition: transform .3s ease, opacity .3s ease;
        z-index: 9999;
        pointer-events: none;
    }
    #toast.show { transform: translateX(-50%); opacity: 1; }
    #toast.interactive { pointer-events: auto; }
    #toastAction {
        background: transparent; border: 1px solid currentColor; color: inherit;
        border-radius: 6px; padding: 4px 10px; height: auto; min-width: 0;
        font-size: 13px; font-weight: 600; cursor: pointer;
    }
    #toastAction:hover { background: rgba(127,127,127,.25); color: inherit; }

    
    body.dragging .editor-wrapper::after {
        content: "Bırakın — dosya açılacak";
        position: absolute; inset: 8px;
        display: flex; align-items: center; justify-content: center;
        border: 2px dashed var(--accent);
        border-radius: 8px;
        background: color-mix(in srgb, var(--bg) 85%, var(--accent));
        color: var(--accent);
        font-weight: 600;
        pointer-events: none;
    }

    
    * { scrollbar-width: thin; scrollbar-color: var(--scroll-thumb) transparent; }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }

    
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: .01ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: .01ms !important;
            scroll-behavior: auto !important;
        }
    }

    
    @media (max-width: 620px) {
        .grow { flex: 1 1 100%; order: -1; }
        .find-row, .rep-row { flex: 1 1 100%; }
        #searchPanel input[type="text"] { flex: 1 1 100%; }
    }
    @media (max-width: 380px) {
        .statusbar .opt { display: none; }
    }

    
    @media (forced-colors: active) {
        button[aria-expanded="true"], button[aria-pressed="true"] { forced-color-adjust: none; background: Highlight; color: HighlightText; }
    }

    .editor-wrapper { min-height: 0; }
    textarea { min-width: 0; }
    textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    button { padding-inline: 8px; }
    .tools { flex-wrap: wrap; }
    .find-row, .rep-row { flex-wrap: wrap; }
    #searchPanel input[type="text"] { flex: 1 1 160px; }
    #searchPanel { max-height: 45dvh; overflow-y: auto; }
    .line-numbers { position: relative; padding: 0; }
    #gutterLines { position: absolute; top: 12px; right: 8px; left: 0; }
    .caret-mirror { position: fixed; top: 0; left: -20000px; visibility: hidden; pointer-events: none; border: 0; box-sizing: border-box; }
    button[aria-expanded="true"] { background: var(--active-bg); color: var(--accent); }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    dialog { margin: auto; padding: 20px; width: min(640px,94vw); max-height: 85dvh; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 12px; }
    dialog::backdrop { background: rgb(0 0 0 / .5); }
    dialog p { margin-block: 12px; }
    .draft-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--border); }
    .draft-row span { flex: 1 1 250px; overflow-wrap: anywhere; }
    @media (max-height: 460px) { .toolbar { max-height: 35dvh; overflow-y: auto; } }

</style>
</head>
<body>


<div class="toolbar" role="group" aria-label="Araç çubuğu">
    <div class="group grow">
        <button type="button" id="openButton" data-action="open" title="Dosya Aç (Ctrl+O)" aria-label="Dosya Aç">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
        </button>
        <input type="text" id="fName" value="index.html" placeholder="Tam dosya adı" aria-label="Uzantısıyla birlikte dosya adı" autocomplete="off" spellcheck="false">
        
        <select id="extSelect" title="Dosya uzantısı" aria-label="Dosya uzantısı"></select>
        <button type="button" data-action="save" class="accent" title="Kaydet (Ctrl+S) — Farklı Kaydet için Ctrl+Shift+S" aria-label="Kaydet">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V7l-4-4zm-5 16c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3zm3-10H5V5h10v4z"/></svg>
        </button>
    </div>
    <div class="group tools">
        <button type="button" data-action="new" title="Yeni belge">Yeni</button>
        <button type="button" data-action="save-as" title="Farklı kaydet (Ctrl+Shift+S)">Farklı kaydet</button>
        <button type="button" data-action="undo" aria-label="Geri al" title="Geri al (Ctrl+Z)">↶</button>
        <button type="button" data-action="redo" aria-label="Yinele" title="Yinele (Ctrl+Shift+Z)">↷</button>
        <button type="button" data-action="drafts">Taslaklar</button>
        <button type="button" id="btnTab" data-action="tab" aria-pressed="false" title="Tab ile girintilemeyi aç/kapat; Esc ile araç çubuğuna çık">Tab girinti</button>
        <button type="button" id="btnPairs" data-action="pairs" aria-pressed="true" title="Otomatik parantez ve girinti">Oto. parantez</button>
        <button type="button" id="updateButton" data-action="update" hidden>Güncelle</button>
        <button type="button" id="btnWrap" data-action="wrap" title="Satır Kaydır" aria-label="Satır Kaydır" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h10v2H4z"/></svg>
        </button>
        <button type="button" id="btnSearch" data-action="search" title="Ara ve Değiştir (Ctrl+F)" aria-label="Ara ve Değiştir" aria-expanded="false" aria-controls="searchPanel">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
        <button type="button" id="btnTheme" data-action="theme" title="Tema Değiştir" aria-label="Tema Değiştir">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
        </button>
    </div>
</div>

<div id="searchPanel" role="search" aria-label="Ara ve değiştir" hidden>
    <div class="find-row">
        <input type="text" id="sTxt" placeholder="Aranacak kelime" aria-label="Aranacak metin" autocomplete="off" spellcheck="false">
        <span id="findCount" role="status" aria-live="polite" aria-label="Eşleşme sayısı">0/0</span>
        <button type="button" data-action="find-prev" title="Önceki (Shift+Enter)" aria-label="Önceki eşleşme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
        </button>
        <button type="button" data-action="find-next" title="Sonraki (Enter)" aria-label="Sonraki eşleşme">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
        </button>
    </div>
    <div class="rep-row">
        <input type="text" id="rTxt" placeholder="Yeni değer" aria-label="Yeni değer" autocomplete="off" spellcheck="false">
        <label class="checkbox-label" title="Büyük/küçük harf duyarlı">
            <input type="checkbox" id="cCase" aria-label="Büyük küçük harf duyarlı">Aa
        </label>
        <label class="checkbox-label" title="Regex modu ($1, $&amp; destekli)">
            <input type="checkbox" id="cReg" aria-label="Regex modu">.*
        </label>
        <label class="checkbox-label" title="Editördeki seçimi sabit arama kapsamı yap"><input type="checkbox" id="cScope">Seçimde</label>
        <button type="button" data-action="replace" title="Tümünü Değiştir" aria-label="Tümünü değiştir" style="padding:0 12px">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 8l-4 4h3c0 3.31-2.69 6-6 6-1.01 0-1.97-.25-2.8-.7l-1.46 1.46C8.97 19.54 10.43 20 12 20c4.42 0 8-3.58 8-8h3l-4-4zM6 12c0-3.31 2.69-6 6-6 1.01 0 1.97.25 2.8.7l1.46-1.46C15.03 4.46 13.57 4 12 4c-4.42 0-8 3.58-8 8H1l4 4 4-4H6z"/></svg>
        </button>
        <button type="button" data-action="close-search" title="Kapat (Esc)" aria-label="Aramayı kapat">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
    </div>
</div>

<div class="editor-wrapper">
    <div class="line-numbers" id="nums" aria-hidden="true"><div id="gutterLines">1</div></div>
    <textarea id="ed" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"
              aria-label="Metin düzenleyici" aria-describedby="editorHelp" readonly wrap="off"></textarea>
</div>

<p id="editorHelp" class="sr-only">Tab tuşu varsayılan olarak odağı taşır. Tab girinti açıksa Esc ile araç çubuğuna çıkın. Geri al: Ctrl veya Command Z.</p>
<div class="statusbar" id="statusbar">
    <span id="dirtyDot" hidden title="Diske kaydedilmemiş değişiklikler var">●</span>
    <span id="posInfo">Sat 1, Süt 1</span>
    <span class="sep opt">·</span>
    <span id="docInfo" class="opt">1 satır</span>
    <span class="sep opt">·</span>
    <span id="encInfo" class="opt">UTF-8</span>
    <span id="draftStatus" role="status">Yükleniyor…</span>
    <span id="storageWarn" role="status" hidden></span>
</div>

<div id="toast" role="status" aria-live="polite">
    <span id="toastMsg"></span>
    <button type="button" id="toastAction" hidden></button>
</div>

<input type="file" id="fileIn" hidden aria-hidden="true" tabindex="-1">

<dialog id="draftDialog" aria-labelledby="draftTitle">
  <h2 id="draftTitle">Korunan taslaklar</h2>
  <p>Kurtarma yeni bir kopya açar. Eski taslaklar siz silene kadar korunur.</p>
  <div id="draftList"></div>
  <button type="button" data-action="close-drafts">Kapat</button>
</dialog>
<script>
(() => {
  'use strict';

  const $ = id => document.getElementById(id);
  const ui = Object.fromEntries(['ed','nums','gutterLines','fName','extSelect','fileIn','searchPanel',
    'sTxt','rTxt','cCase','cReg','cScope','findCount','posInfo','docInfo','dirtyDot','encInfo',
